# Copy to grafana-secret.yaml (gitignored — see .gitignore) and fill in a real password, same
# pattern as ../webui/secret.example.yaml. Applied by hand once: Argo CD never sees or manages
# this file, same reasoning as webui's secret — a GitOps tool shouldn't be the one holding the
# plaintext credential, even in a private repo.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: observability
type: Opaque
stringData:
  admin-user: admin
  admin-password: CHANGE_ME
