# Translated 1:1 from ../../docker/webui-compose.yml's hardening (log/M3-container-hardening.md)
# — every control there has a direct k8s equivalent below, same reasoning, see inline comments
# only where the translation isn't completely mechanical.
#
# KSV-0024 (the hostPort below) is accepted in ../../.trivyignore, not with an inline
# `# trivy:ignore:` comment — verified locally (pinned aquasec/trivy:0.74.0) that this specific
# rule doesn't honor an inline comment here, at any position tried (directly above the container,
# above `ports:`, or at the top of the file) — it kept failing every time. A bare `KSV-0024` line
# in .trivyignore does suppress it. See that file for the actual reasoning/evidence/expiry.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gametorrent-webui
  namespace: gametorrent
  labels:
    app: gametorrent-webui
spec:
  replicas: 1 # single-node, single PVC set (ReadWriteOnce) — more replicas would fight over the same volumes
  strategy:
    type: Recreate # NOT RollingUpdate: two pods can't both mount the same ReadWriteOnce PVCs at once
  selector:
    matchLabels:
      app: gametorrent-webui
  template:
    metadata:
      labels:
        app: gametorrent-webui
    spec:
      # The GitLab project is private, so pulling from its Container Registry needs auth —
      # confirmed hitting this for real (ErrImagePull: 403 Forbidden) the first time this was
      # deployed. Created once via:
      #   kubectl -n gametorrent create secret docker-registry gitlab-registry-pull \
      #     --docker-server=registry.gitlab.com --docker-username=<token-name> \
      #     --docker-password=<a token scoped to read_registry only — Reporter role is enough>
      # Dedicated token, not the broad gitlantoken.md one or the read_repository one in
      # k8s/argocd/repo-secret.yaml (registry pull is a different GitLab scope, read_registry,
      # from git clone's read_repository) — same least-privilege reasoning as log/M6.
      imagePullSecrets:
        - name: gitlab-registry-pull
      # This app never calls the k8s API, so there's no reason a token for it should even
      # exist inside the pod's filesystem — if the app were ever fully compromised (RCE),
      # there'd be nothing here to steal for a vertical escalation into the cluster API.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # the `node` user baked into webui/Dockerfile
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # local-path PVCs are created root-owned. The app runs as uid 1000 with a read-only root
        # filesystem, so it can't fix this itself — this is the k8s-native version of the manual
        # `docker run ... chown -R 1000:1000` done once for the Docker volumes during the M3 cutover.
        - name: fix-volume-ownership
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command: ["sh", "-c", "chown -R 1000:1000 /app/webui/data /app/downloads /app/roms /var/lib/clamav"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            readOnlyRootFilesystem: true # the chown only touches the mounted PVCs below, never its own container fs
          volumeMounts:
            - { name: webui-data, mountPath: /app/webui/data }
            - { name: webui-downloads, mountPath: /app/downloads }
            - { name: webui-roms, mountPath: /app/roms }
            - { name: webui-clamav-db, mountPath: /var/lib/clamav }
        # Applies database migrations (and, once, imports the old JSON files) as gt_owner, the only
        # role that may change the schema. Runs to completion before the app starts, so the app
        # never sees a half-migrated database, and only this initContainer ever holds the owner
        # credentials (webui-db-migrate); the app container below doesn't get them.
        # Waits up to ~3 min for Postgres, which starts alongside it.
        - name: db-migrate
          image: registry.gitlab.com/kannguyen3105/gametorrent/webui:main
          imagePullPolicy: IfNotPresent # the image is pinned by digest (k8s/webui/kustomization.yaml), so a restart never needs the registry
          command: ["node", "db/migrate.js"]
          workingDir: /app/webui
          envFrom:
            - secretRef:
                name: webui-db-migrate # DATABASE_OWNER_URL
            - secretRef:
                name: webui-db # DATA_ENCRYPTION_KEY (to encrypt the imported Jackett key)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            # Read-only: the import only reads the JSON files, so rolling back to the previous
            # image still finds them exactly as they were.
            - { name: webui-data, mountPath: /app/webui/data, readOnly: true }
      containers:
        - name: gametorrent-webui
          # The tag here is only a placeholder: k8s/webui/kustomization.yaml pins this image (both the
          # app and the db-migrate initContainer) to an exact digest. A moving :main tag never made
          # Argo CD restart the pod, so a rebuilt image was silently not running (found 2026-11-04).
          # cicd/scripts/pin-webui-image.js updates the pin; cicd/tests/manifest-selftest.js (CI)
          # fails if it's missing.
          image: registry.gitlab.com/kannguyen3105/gametorrent/webui:main
          imagePullPolicy: IfNotPresent # the image is pinned by digest (k8s/webui/kustomization.yaml), so a restart never needs the registry
          ports:
            # hostPort, not a Service NodePort: keeps parity with the Docker deployment's literal
            # `-p 3000:3000` on this same VM (same bookmarks, same Tailscale/LAN address keep
            # working). Accepted for single-node only (../../.trivyignore: KSV-0024) — revisit
            # (Ingress/LoadBalancer instead) before any multi-node move.
            - containerPort: 3000
              hostPort: 3000
          envFrom:
            - secretRef:
                name: webui-env
            - secretRef:
                name: webui-db # DATABASE_URL (gt_app: no schema rights), DATA_ENCRYPTION_KEY
          env:
            # Self sign-up: "approval" = new accounts wait for an admin (Admin tab), "open" = they
            # work immediately, "off" = only admins create accounts. Sign-ups are never admins.
            - name: SIGNUP_MODE
              value: approval
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1" # not present in the Docker Compose file (no cpu limit there) — added here since
                       # k8s makes it free to set; stops a runaway extraction from starving the node
              memory: 1536Mi # same ceiling as docker-compose.yml's mem_limit: 1536m
          livenessProbe:
            httpGet: { path: /login.html, port: 3000 }
            initialDelaySeconds: 20 # matches docker-compose's healthcheck start_period
            periodSeconds: 30       # matches healthcheck interval
            timeoutSeconds: 5       # matches healthcheck timeout
            failureThreshold: 3     # matches healthcheck retries
          readinessProbe:
            httpGet: { path: /login.html, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - { name: webui-data, mountPath: /app/webui/data }
            - { name: webui-downloads, mountPath: /app/downloads }
            - { name: webui-roms, mountPath: /app/roms }
            - { name: webui-clamav-db, mountPath: /var/lib/clamav }
            - { name: tmp, mountPath: /tmp }
            - { name: clamav-log, mountPath: /var/log/clamav }
      volumes:
        - { name: webui-data, persistentVolumeClaim: { claimName: webui-data } }
        - { name: webui-downloads, persistentVolumeClaim: { claimName: webui-downloads } }
        - { name: webui-roms, persistentVolumeClaim: { claimName: webui-roms } }
        - { name: webui-clamav-db, persistentVolumeClaim: { claimName: webui-clamav-db } }
        # Memory-backed, matching docker-compose.yml's `tmpfs:` mounts for these same two paths.
        # sizeLimit is a real safety net Docker's tmpfs didn't have — caps how much node RAM either can eat.
        - { name: tmp, emptyDir: { medium: Memory, sizeLimit: 256Mi } }
        - { name: clamav-log, emptyDir: { medium: Memory, sizeLimit: 64Mi } }
