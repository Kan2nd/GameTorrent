# TEMPLATE — copy this file to secret.yaml (same folder), fill in real values,
# and NEVER commit secret.yaml. It's already in .gitignore (k8s/webui/secret.yaml)
# — same treatment as credentials.md and webui/.env in the Docker deployment.
#
#   cp secret.example.yaml secret.yaml
#   # edit secret.yaml with real values
#   kubectl apply -f secret.yaml          # or let kustomize pick it up, see kustomization.yaml
#
# `stringData` (not `data`) is used here so you write plain text, not
# pre-base64'd values — kubectl/kustomize encodes it when applying.
apiVersion: v1
kind: Secret
metadata:
  name: webui-env
  namespace: gametorrent
type: Opaque
stringData:
  WEBUI_USER: "changeme"
  WEBUI_PASSWORD: "changeme-use-a-real-password"
  SESSION_SECRET: "changeme-32-plus-random-bytes"
  VT_API_KEY: ""
  RAWG_API_KEY: ""
