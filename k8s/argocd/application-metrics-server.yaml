# Same pattern as application.yaml (gametorrent-webui) — see its comments. Polls `main`, so this
# shows `app path does not exist` until dev is merged to main; that's expected, not a bug.
#
# destination.namespace is nominal (CreateNamespace=false) — every resource in k8s/metrics-server/
# sets its own explicit namespace (kube-system) or is cluster-scoped (the ClusterRoles/Bindings).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitlab.com/kannguyen3105/gametorrent.git
    targetRevision: main
    path: k8s/metrics-server
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
