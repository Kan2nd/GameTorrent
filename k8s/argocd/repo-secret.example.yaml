# TEMPLATE — copy to repo-secret.yaml (same folder), fill in the real token, apply once:
#   cp repo-secret.example.yaml repo-secret.yaml
#   # edit repo-secret.yaml: paste a GitLab token scoped to read_repository only
#   #   (Settings -> Access tokens -> role Reporter, scope read_repository -
#   #   same least-privilege reasoning as log/M6-gitlab-token.md; don't reuse
#   #   the broad api-scope personal token from gitlantoken.md here)
#   kubectl apply -f repo-secret.yaml
# repo-secret.yaml is gitignored (k8s/argocd/repo-secret.yaml) - never commit it.
#
# Argo CD finds this automatically by matching `url` against an Application's
# repoURL (k8s/argocd/application.yaml) - nothing else needs to reference this
# Secret by name. The `argocd.argoproj.io/secret-type: repository` label is
# what tells Argo CD to treat this Secret as a repo credential at all.
apiVersion: v1
kind: Secret
metadata:
  name: gametorrent-gitlab-repo
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: https://gitlab.com/kannguyen3105/gametorrent.git
  username: oauth2  # GitLab's convention for token-based HTTPS auth (same as Komodo's git_account, cicd/gitops/stacks.toml)
  password: changeme-paste-the-read_repository-scoped-token-here
