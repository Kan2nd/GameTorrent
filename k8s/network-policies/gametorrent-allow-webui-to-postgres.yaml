# The webui is the only thing that may talk to Postgres. Both halves, like webui -> jackett:
# Postgres's ingress names exactly who may connect, the webui's egress names exactly where it may
# go. Postgres gets no egress rule at all, so under default-deny it can't open any connection out
# (not even DNS): a compromised database has nowhere to send data.
#
# `kubectl exec` and `kubectl port-forward` don't go through NetworkPolicy; that's how backups
# (pg_dump via exec) and debugging still work, and why they need cluster-admin rights.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-webui-to-postgres
  namespace: gametorrent
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gametorrent-webui
      ports:
        - { protocol: TCP, port: 5432 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-webui-egress-to-postgres
  namespace: gametorrent
spec:
  podSelector:
    matchLabels:
      app: gametorrent-webui
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - { protocol: TCP, port: 5432 }
