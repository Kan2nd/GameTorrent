# The one legitimate pod-to-pod path in this namespace: webui's Search tab calling Jackett at
# http://jackett:9117 (docs/K8S_MIGRATION.md Phase 5 — this in-cluster address is what replaced
# the LAN-IP-that-changes-on-reboot problem). Expressed on both sides on purpose: Jackett's
# ingress rule names exactly who may connect, webui's egress rule names exactly where it may
# go — a NetworkPolicy only takes effect where both sides agree, so either half alone would
# silently do nothing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-webui-to-jackett
  namespace: gametorrent
spec:
  podSelector:
    matchLabels:
      app: jackett
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gametorrent-webui
      ports:
        - { protocol: TCP, port: 9117 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-webui-egress-to-jackett
  namespace: gametorrent
spec:
  podSelector:
    matchLabels:
      app: gametorrent-webui
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: jackett
      ports:
        - { protocol: TCP, port: 9117 }
