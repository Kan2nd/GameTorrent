# Straight from upstream — unmodified. insecureSkipTLSVerify here is about the connection from
# the k8s API server's aggregation layer TO metrics-server's own Service (in-cluster, low
# stakes) — a separate concern from --kubelet-insecure-tls in deployment.yaml, which is about
# metrics-server trusting each kubelet's self-signed serving cert.
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  labels:
    k8s-app: metrics-server
  name: v1beta1.metrics.k8s.io
spec:
  group: metrics.k8s.io
  groupPriorityMinimum: 100
  insecureSkipTLSVerify: true
  service:
    name: metrics-server
    namespace: kube-system
  version: v1beta1
  versionPriority: 100
