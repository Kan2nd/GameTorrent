<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameTorrent — Sign in</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preload" href="/fonts/PressStart2P-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/VT323-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
</head>
<body class="login-body">
  <form id="loginForm" class="login-card">
    <div class="login-logo">
      <span class="sprite" data-sprite="cartLogo"></span>
      <h1 class="logo-text">GAME<span>TORRENT</span></h1>
    </div>
    <p class="muted blink-line">PLAYER 1 — INSERT CREDENTIALS</p>
    <label>Username
      <input type="text" id="username" autocomplete="username" required autofocus>
    </label>
    <label>Password
      <input type="password" id="password" autocomplete="current-password" required>
    </label>
    <button type="submit"><span class="sprite" data-sprite="play"></span>Sign in</button>
    <p id="loginError" class="error" hidden></p>
    <p id="loginNotice" class="muted" hidden></p>
    <button type="button" id="showSignupBtn" class="ghost-btn" hidden>New player? Create an account</button>
  </form>

  <form id="signupForm" class="login-card" hidden>
    <div class="login-logo">
      <span class="sprite" data-sprite="cartLogo"></span>
      <h1 class="logo-text">NEW<span>PLAYER</span></h1>
    </div>
    <p id="signupModeText" class="muted"></p>
    <label>Username
      <input type="text" id="signupUsername" autocomplete="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9_.\-]{3,32}" required>
    </label>
    <label>Password (12-128 characters)
      <input type="password" id="signupPassword" autocomplete="new-password" minlength="12" maxlength="128" required>
    </label>
    <label>Repeat password
      <input type="password" id="signupPassword2" autocomplete="new-password" minlength="12" maxlength="128" required>
    </label>
    <button type="submit"><span class="sprite" data-sprite="play"></span>Create account</button>
    <p id="signupError" class="error" hidden></p>
    <button type="button" id="showLoginBtn" class="ghost-btn">Back to sign in</button>
  </form>

  <script src="/sprites.js"></script>
  <script src="/login.js"></script>
</body>
</html>
