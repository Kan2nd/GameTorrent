# GameTorrent CI/CD
#
# This file lives in cicd/ rather than the repo root — the GitLab project's
# Settings > CI/CD > General pipelines > "CI/CD configuration file" must be
# cicd/.gitlab-ci.yml (see docs/CI_CD.md). Until 2026-10-01 that setting was
# empty, so GitLab found no config and NO pipeline ever ran (log/H1).
# Jobs still run with the repo root as their working directory.
#
# Branch model (see docs/CI_CD.md, docs/GIT_WORKFLOW.md):
#   dev   -> integration branch, full pipeline on every push / MR
#   main  -> release branch; merging requires this pipeline to pass
#            ("Pipelines must succeed" is on), and the merge is what triggers
#            the Komodo deploy — so nothing reaches the VM without passing here.
#
# ── Security gates ─────────────────────────────────────────────────────────
#   secret-scan      gitleaks over the full git history
#   semgrep-sast     SAST over poc/ AND webui/ (webui/ is the network-facing part —
#                    it was never scanned before the 2026-10 audit)
#   test:security    regression tests for the audit fixes (cicd/tests/)
#   trivy-fs         vulnerable dependencies (all lockfiles) + Dockerfile misconfig
#   build-image      builds the image that is actually deployed (webui/Dockerfile)
#   trivy-image      OS + app vulnerabilities inside that image
# All gates are BLOCKING. Accepted risks live in .trivyignore, each with a reason
# and an expiry date — never by setting allow_failure.
#
# Every scanner image is pinned to an exact version so results are reproducible
# (a :latest scanner can change its rules between two runs of the same commit).

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # A push to a branch that already has an open MR would otherwise run twice.
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_BRANCH == "main"'

default:
  image: node:20-bookworm-slim@sha256:2cf067cfed83d5ea958367df9f966191a942351a2df77d6f0193e162b5febfc0
  cache:
    key:
      files:
        - cicd/package-lock.json
    paths:
      - cicd/node_modules/

variables:
  IMAGE_NAME: "gametorrent-webui"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

stages:
  - validate
  - test
  - sast
  - dependency-scan
  - build
  - image-scan
  - registry
  - deploy

# ── validate ─────────────────────────────────────────────────────────────────

validate:catalog:
  stage: validate
  script:
    - cd cicd
    - npm ci
    - npm run validate:catalog

validate:syntax:
  stage: validate
  cache: []
  script:
    - for f in poc/*.js webui/server.js webui/lib/*.js webui/public/*.js cicd/tests/*.js; do node --check "$f" || exit 1; done

# ── test ─────────────────────────────────────────────────────────────────────
# Regression tests for the security fixes. security-selftest: pipeline-level (path traversal in
# download folders, SSRF guard, zip symlinks). api-selftest: builds a throwaway database with the
# production permission model, imports fake legacy JSON, starts the real webui and attacks it over
# HTTP (file-download traversal, revocation, lockout, sign-up approval, last-admin race, request
# scan options, audit-log immutability, cross-site guard). search-selftest: the typo-tolerant matcher and
# search widening (no database). manifest-selftest: static checks on
# k8s/ (every image pinned by digest, no :latest, capabilities on an allowlist). Needs no network
# beyond npm.
test:security:
  stage: test
  cache: []
  # A throwaway Postgres (same pinned image as k8s/postgres/statefulset.yaml), destroyed with the
  # job. `trust` auth so no password sits in this file: the test still runs the production role
  # setup (k8s/postgres/init-roles.sql), and the permission checks depend on role grants, not passwords.
  services:
    - name: postgres@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
      alias: postgres
  variables:
    POSTGRES_HOST_AUTH_METHOD: trust
    TEST_PG_SUPERUSER_URL: postgres://postgres@postgres:5432/postgres
  script:
    - cd poc && npm ci --omit=dev && cd ..
    - cd webui && npm ci --omit=dev && cd ..
    - node cicd/tests/security-selftest.js
    - node cicd/tests/manifest-selftest.js
    - node cicd/tests/search-selftest.js
    - node cicd/tests/api-selftest.js

# ── Gate 1 — secrets ─────────────────────────────────────────────────────────
secret-scan:
  stage: sast
  cache: []
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"          # full history — a secret committed and later deleted is still leaked
  script:
    - gitleaks git . --redact --no-banner --verbose --report-format sarif --report-path gitleaks.sarif
  artifacts:
    when: always
    paths: [ gitleaks.sarif ]
    expire_in: 1 week

# ── Gate 2 — SAST ────────────────────────────────────────────────────────────
semgrep-sast:
  stage: sast
  cache: []
  image: semgrep/semgrep:1.178.0
  script:
    - mkdir -p reports
    - >
      semgrep scan
      --config p/owasp-top-ten
      --config p/javascript
      --config p/nodejsscan
      --config p/ci
      --severity ERROR
      --error
      --metrics off
      --exclude node_modules
      --sarif --output reports/semgrep.sarif
      poc webui cicd/tests
  artifacts:
    when: always
    paths: [ reports/semgrep.sarif ]
    expire_in: 1 week

# ── Gate 3 — dependencies + IaC misconfig ────────────────────────────────────
# Scans every package-lock.json (poc/, webui/, cicd/) for known-vulnerable packages,
# plus the Dockerfiles for misconfigurations. No --ignore-unfixed here: an app
# dependency with no fix must be consciously accepted in .trivyignore, not skipped.
trivy-fs:
  stage: dependency-scan
  cache: []
  image:
    name: aquasec/trivy:0.74.0
    entrypoint: [""]
  script:
    - mkdir -p reports
    - trivy fs --scanners vuln,misconfig --severity HIGH,CRITICAL --ignorefile .trivyignore --exit-code 1 --format table .
    - trivy fs --scanners vuln,misconfig --severity HIGH,CRITICAL --ignorefile .trivyignore --format sarif --output reports/trivy-fs.sarif .
  artifacts:
    when: always
    paths: [ reports/trivy-fs.sarif ]
    expire_in: 1 week

# ── build ────────────────────────────────────────────────────────────────────
# Builds the image Komodo actually deploys (webui/Dockerfile), not the CLI one,
# and hands the exact bytes to the next stage so the scan can't drift from the build.
build-image:
  stage: build
  cache: []
  image: docker:24.0.9
  services:
    - docker:24.0.9-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  script:
    - docker build -f webui/Dockerfile -t "$IMAGE_NAME:$IMAGE_TAG" .
    - docker save "$IMAGE_NAME:$IMAGE_TAG" | gzip > image.tar.gz
  artifacts:
    paths: [ image.tar.gz ]
    expire_in: 1 hour

# ── Gate 4 — image scan ──────────────────────────────────────────────────────
# --ignore-unfixed here (unlike trivy-fs): Debian ships many base-OS CVEs with no
# fixed package yet, which nobody can act on; fixable ones still fail the build.
trivy-image:
  stage: image-scan
  cache: []
  image:
    name: aquasec/trivy:0.74.0
    entrypoint: [""]
  needs: [ build-image ]
  script:
    - mkdir -p reports
    - trivy image --input image.tar.gz --severity HIGH,CRITICAL --ignore-unfixed --ignorefile .trivyignore --exit-code 1 --format table
    - trivy image --input image.tar.gz --severity HIGH,CRITICAL --ignore-unfixed --ignorefile .trivyignore --format cyclonedx --output reports/sbom.cdx.json
  artifacts:
    when: always
    paths: [ reports/sbom.cdx.json ]
    expire_in: 1 month

# ── registry ─────────────────────────────────────────────────────────────────
# Pushes the EXACT bytes trivy-image just scanned (loaded from its own artifact,
# never rebuilt) — the image a pull ever gets is provably the one that passed every
# gate above. Tagged only by commit SHA (immutable — see log/M5 on not using :latest).
# This is what k8s/webui/deployment.yaml's image: field needs to actually mean something
# (docs/K8S_MIGRATION.md Phase 2) — CI needs no new secret: CI_REGISTRY_USER/PASSWORD are
# GitLab predefined variables, scoped to just this project's own registry.
push-image:
  stage: registry
  cache: []
  image: docker:24.0.9
  services:
    - docker:24.0.9-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  needs: [ build-image, trivy-image ]
  script:
    - docker load -i image.tar.gz
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker tag "$IMAGE_NAME:$IMAGE_TAG" "$CI_REGISTRY_IMAGE/webui:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/webui:$CI_COMMIT_SHORT_SHA"
    # Also a floating tag per branch, so k8s/webui/deployment.yaml has something stable to
    # reference without a second commit chasing each new SHA. Trade-off, made deliberately
    # (not an oversight of log/M5's "pin, don't float" rule): switch to a pinned SHA, or wire
    # up Argo CD Image Updater, once the migration itself has settled.
    - docker tag "$IMAGE_NAME:$IMAGE_TAG" "$CI_REGISTRY_IMAGE/webui:$CI_COMMIT_REF_SLUG"
    - docker push "$CI_REGISTRY_IMAGE/webui:$CI_COMMIT_REF_SLUG"
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# Signs the exact SHA tag push-image just produced, with cosign (sigstore) — proves later that
# whatever's actually running came from this pipeline, not a registry tag someone pushed by
# hand or swapped after the fact. Needs two GitLab CI/CD variables that do NOT exist yet by
# default and must be created once, by hand, in Settings -> CI/CD -> Variables (masked +
# protected): COSIGN_PRIVATE_KEY (the full contents of cosign.key) and COSIGN_PASSWORD (the
# password chosen when that key was generated). See docs/TUTORIALS.md for the full walkthrough,
# including generating that key yourself — deliberately NOT something this job or any CI run
# does on its own; a signing key is only worth anything if it's never touched an automated
# generation step with its own blast radius.
sign-image:
  stage: registry
  cache: []
  image: alpine:3.21
  needs: [ push-image ]
  before_script:
    - apk add --no-cache curl
    - curl -sSLo /usr/local/bin/cosign "https://github.com/sigstore/cosign/releases/download/v3.1.4/cosign-linux-amd64"
    - chmod +x /usr/local/bin/cosign
  script:
    - cosign login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    - echo "$COSIGN_PRIVATE_KEY" > cosign.key
    # COSIGN_PASSWORD is read automatically from the environment by cosign itself - not passed
    # as a flag, so it never shows up in a `ps`/job-log command line.
    - cosign sign --key cosign.key --yes "$CI_REGISTRY_IMAGE/webui:$CI_COMMIT_SHORT_SHA"
    - rm -f cosign.key
  # Gated on the variable actually existing, not just the branch - until COSIGN_PRIVATE_KEY is
  # created (docs/TUTORIALS.md's key-generation step), this job is skipped entirely rather than
  # failing every pipeline. Remove the "&& $COSIGN_PRIVATE_KEY" half once that's done, to make
  # a missing/revoked key loudly fail the pipeline instead of silently skipping signing.
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" && $COSIGN_PRIVATE_KEY'
    - if: '$CI_COMMIT_BRANCH == "main" && $COSIGN_PRIVATE_KEY'

# ── deploy ───────────────────────────────────────────────────────────────────
# gametorrent-webui deploys via Argo CD (GitOps) once a merge lands on main - see
# docs/K8S_MIGRATION.md. Merges into main require this whole pipeline to pass, so
# every gate above sits in front of that deploy.

deploy:tauri-placeholder:
  stage: deploy
  cache: []
  script:
    - echo "Nothing to deploy yet — Phase 2 (apps/desktop, Tauri) will build installers here (tauri build) and publish a GitLab Release."
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual

# Plain-Docker deploy of the poc CLI image (cicd/ansible/ + docker/poc-compose.yml).
# DISABLED until these CI/CD variables exist: SSH_PRIVATE_KEY (masked, file type),
# DEPLOY_HOST, DEPLOY_USER, REGISTRY. Not how the web UI is deployed (that's Komodo).
.deploy:docker-compose:
  stage: deploy
  image: alpine:3.20
  script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | ssh-add -
    - mkdir -p ~/.ssh && ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
    - scp docker/poc-compose.yml "$DEPLOY_USER@$DEPLOY_HOST:~/gametorrent-poc-compose.yml"
    - >
      ssh "$DEPLOY_USER@$DEPLOY_HOST"
      "REGISTRY=$REGISTRY IMAGE_TAG=$IMAGE_TAG VT_API_KEY=$VT_API_KEY
      docker compose -f ~/gametorrent-poc-compose.yml pull"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
