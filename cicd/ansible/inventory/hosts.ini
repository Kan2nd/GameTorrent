[docker_hosts]
; ansible_host is NOT set here — resolved dynamically by ./host_vars/kan2server.yml
; (VMware DHCP lease lookup by MAC, see ../scripts/resolve-vm-ip.sh) instead of a
; hardcoded IP that breaks every time the VM's lease changes across a reboot.
kan2server ansible_user=<ssh-user>
; vm1 ansible_host=<vm-ip> ansible_user=kan2nd   ; k8s control-plane box, unused now that this project is Docker-only — currently powered off/unreachable. Uncomment if it becomes a second Docker host later.

[docker_hosts:vars]
ansible_python_interpreter=/usr/bin/python3

# Phase 1 of the k3s move (docs/K8S_MIGRATION.md): single-node k3s runs
# ALONGSIDE Docker on the same box, not on a separate host. Confirmed
# 2026-10: 6 vCPU / 6.2GB RAM / 48GB disk (31GB free after reclaiming
# Docker build cache + extending the LV into previously-unallocated VG
# space), no port clash with the running Docker stack. If vm1 above is
# ever revived, it's a candidate to move k3s onto its own box instead —
# not needed for phase 1.
[k3s_hosts]
; see the comment under [docker_hosts] above — same host, same dynamic resolution.
kan2server ansible_user=<ssh-user>

[k3s_hosts:vars]
ansible_python_interpreter=/usr/bin/python3
